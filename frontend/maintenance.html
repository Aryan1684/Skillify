<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillify – Under Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --teal:   #10b981;
            --teal-d: #059669;
            --cyan:   #06b6d4;
            --dark:   #030d1a;
            --card:   rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.09);
            --text:   #f0fdf4;
            --sub:    #94a3b8;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text);
            overflow: hidden;
        }

        /* ── animated mesh background ── */
        .bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse 80% 60% at 20% -10%, rgba(16,185,129,.22) 0%, transparent 60%),
                        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(6,182,212,.18) 0%, transparent 55%),
                        var(--dark);
        }

        /* ── floating orbs ── */
        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(60px); opacity: .35; animation: drift 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 380px; height: 380px; background: #10b981; top: -80px;  left: -60px;  animation-duration: 20s; }
        .orb-2 { width: 320px; height: 320px; background: #06b6d4; bottom: -80px; right: -60px; animation-duration: 15s; animation-delay: -5s; }
        .orb-3 { width: 200px; height: 200px; background: #6366f1; top: 40%; left: 55%; animation-duration: 25s; animation-delay: -10s; }

        @keyframes drift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(30px, 40px) scale(1.08); }
        }

        /* ── grid dots ── */
        .grid {
            position: fixed; inset: 0; z-index: 0;
            background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* ── centre layout ── */
        .scene {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 2rem;
            gap: 2.5rem;
        }

        /* ── logo ── */
        .logo-wrap {
            display: flex; align-items: center; gap: 12px;
            animation: fadeDown .7s cubic-bezier(.16,1,.3,1) both;
        }
        /* inline SVG arrow filled with teal gradient */
        .logo-wrap svg.icon { width: 44px; height: 44px; }
        .logo-text {
            font-size: 1.8rem; font-weight: 800; letter-spacing: -.5px;
            background: linear-gradient(130deg, #10b981, #06b6d4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── card ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem 3.5rem;
            text-align: center;
            max-width: 520px; width: 100%;
            backdrop-filter: blur(24px);
            box-shadow: 0 32px 64px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
            animation: fadeUp .8s .15s cubic-bezier(.16,1,.3,1) both;
        }

        .status-chip {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(16,185,129,.12);
            border: 1px solid rgba(16,185,129,.3);
            color: #34d399;
            font-size: .8rem; font-weight: 600; letter-spacing: .05em;
            padding: .35rem .9rem; border-radius: 999px;
            margin-bottom: 1.5rem;
        }
        .status-chip .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #10b981;
            animation: blink 1.4s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(1.9rem, 4vw, 2.5rem);
            font-weight: 800; line-height: 1.15;
            margin-bottom: 1rem;
            background: linear-gradient(160deg, #f0fdf4 30%, #86efac);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: var(--sub);
            font-size: 1.05rem; line-height: 1.7;
            margin-bottom: 2rem;
        }

        /* Progress bar */
        .progress-wrap {
            background: rgba(255,255,255,.07);
            border-radius: 999px; height: 6px;
            overflow: hidden; margin-bottom: .75rem;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #06b6d4);
            border-radius: 999px;
            width: 70%;
            animation: progress 3s ease-in-out infinite alternate;
        }
        .progress-label {
            font-size: .78rem; color: #475569; text-align: right;
        }

        /* Social / contact row */
        .contact {
            margin-top: 2rem;
            font-size: .82rem; color: #475569;
        }
        .contact a { color: #34d399; text-decoration: none; font-weight: 600; }
        .contact a:hover { text-decoration: underline; }

        /* ── animations ── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; } 50% { opacity: .3; }
        }
        @keyframes progress {
            from { width: 60%; } to { width: 82%; }
        }

        /* ── responsive ── */
        @media (max-width: 500px) {
            .card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="scene">

    <!-- Logo (inline SVG – always visible, no file path needed) -->
    <div class="logo-wrap">
        <svg class="icon" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g1" x1="0" y1="44" x2="44" y2="0" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#10b981"/>
                    <stop offset="1" stop-color="#06b6d4"/>
                </linearGradient>
            </defs>
            <!-- Arrow body -->
            <path d="M22 38V14" stroke="url(#g1)" stroke-width="4" stroke-linecap="round"/>
            <!-- Arrowhead -->
            <path d="M12 24L22 13L32 24" stroke="url(#g1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Circuit dots -->
            <circle cx="22" cy="32" r="2.2" fill="#10b981"/>
            <circle cx="22" cy="25" r="1.5" fill="#34d399" opacity=".6"/>
            <!-- Left branch -->
            <path d="M15 30H10" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity=".7"/>
            <circle cx="9" cy="30" r="1.5" fill="#10b981" opacity=".6"/>
            <!-- Right branch -->
            <path d="M29 30H34" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity=".7"/>
            <circle cx="35" cy="30" r="1.5" fill="#06b6d4" opacity=".6"/>
        </svg>
        <span class="logo-text">Skillify</span>
    </div>

    <!-- Main card -->
    <div class="card">
        <div class="status-chip">
            <span class="dot"></span>
            MAINTENANCE IN PROGRESS
        </div>

        <h1>We'll be back<br>very soon! 🚀</h1>

        <p>
            <strong style="color:#86efac">Skillify</strong> is undergoing scheduled maintenance to bring you a better experience.
            We're working hard and will be live shortly.
        </p>

        <div class="progress-wrap">
            <div class="progress-bar"></div>
        </div>
        <div class="progress-label">Almost there…</div>

        <div class="contact">
            Questions? Reach us at
            <a href="mailto:supportskillify.app@gmail.com">supportskillify.app@gmail.com</a>
        </div>
    </div>

</div>
</body>
</html>
